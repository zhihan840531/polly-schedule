<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Polly 工作台</title>
<style>
body{margin:0;font-family:system-ui,-apple-system,"Noto Sans TC",sans-serif;background:#fffdf7;color:#3f3b32;display:grid;place-items:center;min-height:100vh}
#boot{padding:24px;text-align:center}
</style>
</head>
<body>
<div id="boot">正在載入 Polly 工作台…</div>
<script>
(async()=>{
  try{
    const url='https://raw.githubusercontent.com/zhihan840531/polly-schedule/63f26243e8f4dfe7bc5e2a1215bf97c4d8222a1d/index.html';
    const res=await fetch(url,{cache:'no-store'});
    if(!res.ok) throw new Error('HTTP '+res.status);
    let html=await res.text();
    html=html.replace('</head>',`<style>
      /* 首頁卡片間距：避免「今日待處理」與「今日時間軸」黏在一起 */
      #todayPage .grid{margin-top:16px;}
      @media(max-width:720px){#todayPage .grid{margin-top:14px;}}
    </style></head>`);
    html=html.replace('</body>','<script src="./calendar-fix.js?v=3"><\/script></body>');
    document.open();
    document.write(html);
    document.close();
  }catch(err){
    document.getElementById('boot').innerHTML='<h2>工作台載入失敗</h2><p>請重新整理頁面。</p><small>'+String(err.message||err)+'</small>';
  }
})();
</script>
</body>
</html>
