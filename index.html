<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Polly 工作台</title>
<style>
:root{--cream:#fffdf7;--yellow:#FFF2CC;--gold:#e9c768;--khaki:#f4edd8;--ink:#3f3b32;--muted:#817b6e;--line:#ece6d7;--white:#fff;--danger:#c85d53}
*{box-sizing:border-box} body{margin:0;font-family:system-ui,-apple-system,"Noto Sans TC",sans-serif;background:var(--cream);color:var(--ink)}
button,input,textarea,select{font:inherit}.app{min-height:100vh;padding-bottom:84px}.top{height:66px;background:var(--yellow);display:flex;align-items:center;justify-content:space-between;padding:0 22px;position:sticky;top:0;z-index:10;border-bottom:1px solid #eadcae}
.brand{display:flex;align-items:center;gap:10px;font-weight:800;font-size:20px}.brand img{width:42px;height:42px;object-fit:contain}.top-actions{display:flex;gap:8px}
.btn{border:1px solid var(--line);background:white;border-radius:12px;padding:9px 13px;cursor:pointer}.btn.primary{background:var(--gold);border-color:var(--gold);font-weight:700}.btn.danger{color:var(--danger)}
main{max-width:1080px;margin:auto;padding:24px}.hello h1{margin:0;font-size:28px}.hello p{margin:5px 0 0;color:var(--muted)}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin:20px 0}.stat,.card{background:white;border:1px solid var(--line);border-radius:18px;padding:16px;box-shadow:0 2px 8px rgba(80,65,20,.04)}.stat b{font-size:24px}.stat span{display:block;color:var(--muted);font-size:13px;margin-top:3px}
.grid{display:grid;grid-template-columns:1.45fr .9fr;gap:16px}.section-title{display:flex;align-items:center;justify-content:space-between;margin:0 0 12px}.section-title h2{font-size:18px;margin:0}
.event{padding:12px 0;border-bottom:1px solid var(--line);display:flex;gap:12px}.event:last-child{border:0}.time{font-weight:800;min-width:54px}.event small{color:var(--muted)}
.task{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}.task:last-child{border:0}.task.done span{text-decoration:line-through;color:#aaa}.grow{flex:1}
textarea{width:100%;min-height:105px;border:1px solid var(--line);border-radius:12px;padding:12px;resize:vertical}
.nav{position:fixed;bottom:0;left:0;right:0;height:72px;background:var(--yellow);border-top:1px solid #eadcae;display:flex;justify-content:center;z-index:20}.nav-inner{width:min(760px,100%);display:grid;grid-template-columns:repeat(5,1fr)}
.nav button{border:0;background:transparent;cursor:pointer;color:#706957;font-size:12px;font-weight:650}.nav button.active{color:#332e23}.nav img{display:block;width:30px;height:30px;object-fit:contain;margin:0 auto 2px}
.page{display:none}.page.active{display:block}
.calendar-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:14px}.calendar{display:grid;grid-template-columns:repeat(7,1fr);border:1px solid var(--line);border-radius:18px;overflow:hidden;background:white}.dow{background:#fff9e7;text-align:center;padding:10px 2px;font-size:12px;font-weight:800}.day{min-height:108px;border-top:1px solid var(--line);border-right:1px solid var(--line);padding:8px;cursor:pointer}.day:nth-child(7n){border-right:0}.day.muted{color:#bbb}.day.today{background:#fff9df}.badge{display:block;margin-top:5px;padding:4px 6px;border-radius:7px;background:#f7efd7;font-size:11px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.class-list{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}.class-card h3{margin:0 0 6px}.pill{display:inline-block;background:#fff5cf;border-radius:999px;padding:4px 8px;font-size:12px}
.data-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}.upload{border:2px dashed #e1d5ae;text-align:center;padding:28px;border-radius:18px;background:#fffdf5}.upload img{width:55px}
.fab{position:fixed;right:22px;bottom:91px;width:54px;height:54px;border:0;border-radius:50%;background:var(--gold);font-size:28px;box-shadow:0 5px 18px #c7aa5b55;cursor:pointer}
.modal{display:none;position:fixed;inset:0;background:#0005;z-index:50;align-items:center;justify-content:center;padding:16px}.modal.open{display:flex}.sheet{width:min(520px,100%);max-height:88vh;overflow:auto;background:white;border-radius:22px;padding:20px}.sheet h2{margin-top:0}.form{display:grid;gap:11px}.form label{font-size:13px;font-weight:700}.form input,.form select,.form textarea{width:100%;border:1px solid var(--line);border-radius:10px;padding:10px}.row{display:flex;gap:8px;justify-content:flex-end;margin-top:12px}.record{display:flex;align-items:center;gap:8px;padding:10px;border:1px solid var(--line);border-radius:12px;margin:8px 0}.empty{color:var(--muted);padding:18px;text-align:center}
@media(max-width:720px){main{padding:16px}.grid{grid-template-columns:1fr}.stats{grid-template-columns:repeat(3,1fr)}.stat{padding:12px}.stat b{font-size:20px}.class-list,.data-grid{grid-template-columns:1fr}.day{min-height:75px;padding:5px;font-size:12px}.badge{font-size:9px;padding:3px}.top{padding:0 14px}.brand{font-size:17px}.brand img{width:38px;height:38px}}

.class-toolbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:14px}
.class-search{flex:1;min-width:220px;border:1px solid var(--line);border-radius:12px;padding:10px 12px;background:#fff}
.class-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.class-mini{cursor:pointer;transition:.15s;padding:16px}
.class-mini:hover{transform:translateY(-1px);box-shadow:0 5px 16px rgba(80,65,20,.08)}
.class-mini-top{display:flex;align-items:flex-start;justify-content:space-between;gap:8px}
.class-mini h3{font-size:19px;margin:0}
.class-code{font-size:12px;background:#fff5cf;padding:4px 8px;border-radius:999px;display:inline-block;margin-top:5px}
.class-status{font-size:11px;border-radius:999px;padding:4px 8px;background:#eef7e9;color:#567347;white-space:nowrap}
.class-meta{margin-top:12px;font-size:13px;line-height:1.7;color:var(--muted)}
.class-meta b{color:var(--ink)}
.class-footer{display:flex;justify-content:space-between;align-items:center;margin-top:12px;padding-top:11px;border-top:1px solid var(--line)}
.student-count{font-weight:800}
.detail-head{background:#fff9e7;border:1px solid var(--line);border-radius:16px;padding:16px;margin-bottom:14px}
.detail-kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}
.detail-kpi{background:#fff;border:1px solid var(--line);border-radius:12px;padding:10px}
.detail-kpi small{display:block;color:var(--muted);font-size:11px}
.student-table-wrap{overflow:auto;border:1px solid var(--line);border-radius:14px}
.student-table{width:100%;border-collapse:collapse;min-width:680px;background:#fff}
.student-table th{background:#fff9e7;text-align:left;font-size:12px;padding:10px;border-bottom:1px solid var(--line)}
.student-table td{padding:10px;border-bottom:1px solid var(--line);font-size:13px}
.student-table tr:last-child td{border-bottom:0}
.detail-tabs{display:flex;gap:8px;margin:12px 0}
.detail-tabs button{border:1px solid var(--line);background:#fff;border-radius:999px;padding:7px 12px;cursor:pointer}
.detail-tabs button.active{background:var(--yellow);font-weight:800}
@media(max-width:900px){.class-grid{grid-template-columns:repeat(2,1fr)}}
@media(max-width:620px){.class-grid{grid-template-columns:1fr}.detail-kpis{grid-template-columns:1fr}.class-mini{padding:14px}}
</style>
<link rel="manifest" href="manifest.webmanifest?v=3"/>
<meta name="theme-color" content="#FFF2CC"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-status-bar-style" content="default"/>
<meta name="apple-mobile-web-app-title" content="Polly 工作台"/>
<link rel="icon" type="image/png" href="./app-icon.png?v=5">
<link rel="shortcut icon" type="image/png" href="./app-icon.png?v=5">
<link rel="apple-touch-icon" href="./app-icon.png?v=5">
<link rel="apple-touch-icon" sizes="180x180" href="./apple-touch-icon.png?v=5">
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
</head>
<body>
<div class="app">
<header class="top"><div class="brand"><img src="app-icon.png?v=5"><span>Polly 工作台</span></div><div class="top-actions"><button class="btn" onclick="openQuick()">＋ 新增</button></div></header>
<main>
<section id="today" class="page active">
<div class="hello"><h1>今天</h1><p id="todayDate"></p></div>
<div class="stats"><div class="stat"><b id="courseCount">0</b><span>今日課程</span></div><div class="stat"><b id="absenceCount">0</b><span>學生請假</span></div><div class="stat"><b id="todoCount">0</b><span>未完成待辦</span></div></div>
<div class="grid">
<div><div class="card"><div class="section-title"><h2>今日時間軸</h2><button class="btn" onclick="openQuick('event')">＋ 行程</button></div><div id="todayEvents"></div></div>
<div class="card" style="margin-top:16px"><div class="section-title"><h2>工作日誌</h2><button class="btn primary" onclick="saveLog()">儲存</button></div><textarea id="workLog" placeholder="今天發生什麼？家長聯繫、教材、班級狀況都可以記在這裡…"></textarea></div></div>
<div><div class="card"><div class="section-title"><h2>待處理</h2><button class="btn" onclick="openQuick('task')">＋ 待辦</button></div><div id="todayTasks"></div></div>
<div class="card" style="margin-top:16px"><div class="section-title"><h2>請假 / 代課</h2><button class="btn" onclick="openQuick('absence')">＋</button></div><div id="todaySpecial"></div></div></div>
</div></section>

<section id="calendarPage" class="page"><div class="calendar-head"><div><h1 style="margin:0">行事曆</h1><small style="color:var(--muted)">點日期即可新增當天紀錄</small></div><div><button class="btn" onclick="shiftMonth(-1)">‹</button> <b id="monthTitle"></b> <button class="btn" onclick="shiftMonth(1)">›</button></div></div><div class="calendar" id="calendar"></div></section>

<section id="classes" class="page">
<div class="section-title">
  <div><h1 style="margin:0">班級</h1><small style="color:var(--muted)">依照 Polly 班級資料整理方式顯示</small></div>
  <button class="btn primary" onclick="openClass()">＋ 新增班級</button>
</div>
<div class="class-toolbar">
  <input id="classSearch" class="class-search" placeholder="搜尋班號、老師、學生…" oninput="renderClasses()">
  <button class="btn" onclick="loadPollyClassData()">匯入 Polly 班級資料</button>
</div>
<div id="classList" class="class-grid"></div>
</section>

<section id="work" class="page"><div class="section-title"><div><h1 style="margin:0">工作</h1><small style="color:var(--muted)">待辦、補課與代課紀錄</small></div><button class="btn primary" onclick="openQuick('task')">＋ 新增</button></div><div class="card"><div id="allTasks"></div></div></section>

<section id="data" class="page"><div class="section-title"><div><h1 style="margin:0">資料區</h1><small style="color:var(--muted)">公司資料與 AI 匯入入口</small></div></div><div class="data-grid">
<div class="upload"><img src="icon-plan.png"><h3>AI 匯入</h3><p>一次選「點名表 PDF + Syllabus PDF」<br>系統會自動辨識並配對</p><input id="aiFiles" type="file" accept="application/pdf,.pdf" multiple onchange="startAIImport(this)"><div id="aiStatus" style="margin-top:10px;color:var(--muted);font-size:13px"></div></div>
<div class="card"><h3>基本資料</h3><p>目前班級 <b id="dataClassCount">0</b> 個</p><p>資料會先儲存在這台裝置的瀏覽器中。</p><button class="btn" onclick="go('classes')">管理班級</button></div>
</div></section>
</main>
<button class="fab" onclick="openQuick()">＋</button>
<nav class="nav"><div class="nav-inner">
<button class="active" data-page="today" onclick="go('today',this)"><img src="icon-today.png">今天</button>
<button data-page="calendarPage" onclick="go('calendarPage',this)"><img src="icon-calendar.png">行事曆</button>
<button data-page="classes" onclick="go('classes',this)"><img src="icon-class.png">班級</button>
<button data-page="work" onclick="go('work',this)"><img src="icon-todo.png">工作</button>
<button data-page="data" onclick="go('data',this)"><img src="icon-plan.png">資料</button>
</div></nav>
</div>

<div class="modal" id="quickModal"><div class="sheet"><div class="section-title"><h2>新增紀錄</h2><button class="btn" onclick="closeModal('quickModal')">✕</button></div>
<div class="form"><label>類型<select id="qType" onchange="typeChanged()"><option value="event">行程 / 課程</option><option value="absence">學生請假</option><option value="sub">老師代課</option><option value="task">待辦</option></select></label>
<label>日期<input id="qDate" type="date"></label><label>標題<input id="qTitle" placeholder="例如：PHC / Emma 請假"></label><label id="timeLabel">時間<input id="qTime" type="time"></label><label>備註<textarea id="qNote" placeholder="進度、補課內容、代課老師等…"></textarea></label></div>
<div class="row"><button class="btn" onclick="closeModal('quickModal')">取消</button><button class="btn primary" onclick="saveQuick()">儲存</button></div></div></div>

<div class="modal" id="classModal"><div class="sheet"><div class="section-title"><h2 id="classModalTitle">新增班級</h2><button class="btn" onclick="closeModal('classModal')">✕</button></div>
<div class="form"><input id="editClassId" type="hidden"><label>完整班級代碼<input id="classCode" placeholder="例如 PHC-01"></label><label>班級名稱<input id="className" placeholder="例如 PHC"></label><label>老師<input id="classTeacher" placeholder="Ann"></label><label>上課時間<input id="classSchedule" placeholder="一三五 13:30–16:00"></label><label>學生（逗號分隔）<textarea id="classStudents" placeholder="Emma, Alston, Quinne, Glenn"></textarea></label></div>
<div class="row"><button class="btn" onclick="closeModal('classModal')">取消</button><button class="btn primary" onclick="saveClass()">儲存</button></div></div></div>


<div class="modal" id="importModal"><div class="sheet">
  <div class="section-title"><h2>✨ AI 匯入預覽</h2><button class="btn" onclick="closeModal('importModal')">✕</button></div>
  <div id="importProgress" style="padding:8px 0;color:var(--muted)">正在讀取 PDF…</div>
  <div id="importPreview"></div>
  <div class="row"><button class="btn" onclick="closeModal('importModal')">取消</button><button id="confirmImportBtn" class="btn primary" onclick="confirmAIImport()" disabled>確認匯入</button></div>
</div></div>

<div class="modal" id="classDetailModal"><div class="sheet" style="width:min(880px,100%)">
  <div class="section-title"><h2 id="detailTitle">班級資料</h2><button class="btn" onclick="closeModal('classDetailModal')">✕</button></div>
  <div id="detailSummary"></div>
  <div class="detail-tabs">
    <button id="tabStudents" class="active" onclick="switchClassTab('students')">學生名單</button>
    <button id="tabLessons" onclick="switchClassTab('lessons')">課程進度</button>
  </div>
  <div id="detailStudents"></div>
  <div id="detailLessons" style="display:none"></div>
</div></div>

<script>
const KEY='polly-workspace-v1';
const iso=d=>d.toISOString().slice(0,10);
const today=()=>{let d=new Date(); return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`};
let state=JSON.parse(localStorage.getItem(KEY)||'null')||{
 records:[
 {id:1,type:'event',date:'2026-08-14',time:'13:30',title:'PHC',note:'Unit 4 Lesson 2 · Teacher Ann'},
 {id:2,type:'absence',date:'2026-08-14',time:'',title:'Emma 請假',note:'待補：Unit 4 Lesson 2'},
 {id:3,type:'sub',date:'2026-08-14',time:'',title:'Ann → Polly',note:'PHC · 2.5 小時'},
 {id:4,type:'task',date:'2026-08-14',time:'',title:'通知 Emma 媽媽補課',note:'',done:false},
 {id:5,type:'event',date:'2026-08-17',time:'13:30',title:'PHC',note:'Unit 4 Lesson 3'},
 {id:6,type:'task',date:'2026-08-19',time:'',title:'印 PHC worksheet',note:'',done:false}
 ],
 classes:[{id:1,code:'PHC-01',name:'PHC',teacher:'Ann',schedule:'一三五 13:30–16:00',students:['Emma','Alston','Quinne','Glenn']}],
 logs:{}
};
function persist(){localStorage.setItem(KEY,JSON.stringify(state));render()}
function go(id,btn){document.querySelectorAll('.page').forEach(x=>x.classList.remove('active'));document.getElementById(id).classList.add('active');document.querySelectorAll('.nav button').forEach(x=>x.classList.remove('active'));(btn||document.querySelector(`[data-page="${id}"]`))?.classList.add('active');render()}
function openQuick(type='event',date=today()){qType.value=type;qDate.value=date;qTitle.value='';qTime.value='';qNote.value='';typeChanged();quickModal.classList.add('open')}
function closeModal(id){document.getElementById(id).classList.remove('open')}
function typeChanged(){timeLabel.style.display=qType.value==='event'?'block':'none'}
function saveQuick(){if(!qTitle.value.trim())return alert('請輸入標題');state.records.push({id:Date.now(),type:qType.value,date:qDate.value||today(),time:qTime.value,title:qTitle.value.trim(),note:qNote.value.trim(),done:false});closeModal('quickModal');persist()}
function delRecord(id){if(confirm('確定要刪除這筆紀錄嗎？')){state.records=state.records.filter(x=>x.id!==id);persist()}}
function toggleTask(id){let r=state.records.find(x=>x.id===id);if(r){r.done=!r.done;persist()}}
function saveLog(){state.logs[today()]=workLog.value;localStorage.setItem(KEY,JSON.stringify(state));alert('工作日誌已儲存')}
function openClass(id){let c=state.classes.find(x=>x.id===id);editClassId.value=c?.id||'';classCode.value=c?.code||'';className.value=c?.name||'';classTeacher.value=c?.teacher||'';classSchedule.value=c?.schedule||'';classStudents.value=(c?.students||[]).join(', ');classModalTitle.textContent=c?'編輯班級':'新增班級';classModal.classList.add('open')}
function saveClass(){if(!classCode.value.trim()||!className.value.trim())return alert('請填班級代碼與名稱');let obj={id:+editClassId.value||Date.now(),code:classCode.value.trim(),name:className.value.trim(),teacher:classTeacher.value.trim(),schedule:classSchedule.value.trim(),students:classStudents.value.split(/[,，]/).map(x=>x.trim()).filter(Boolean)};let idx=state.classes.findIndex(x=>x.id===obj.id);if(idx>=0)state.classes[idx]=obj;else state.classes.push(obj);closeModal('classModal');persist()}
function delClass(id){if(confirm('確定刪除這個班級嗎？此版本只刪班級基本資料，不會刪除既有行事曆紀錄。')){state.classes=state.classes.filter(x=>x.id!==id);persist()}}

let pendingImport=null;
if(window.pdfjsLib){pdfjsLib.GlobalWorkerOptions.workerSrc='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js'}

async function readPdf(file){
  const data=new Uint8Array(await file.arrayBuffer());
  const pdf=await pdfjsLib.getDocument({data}).promise;
  const pages=[];
  for(let p=1;p<=pdf.numPages;p++){
    const page=await pdf.getPage(p);
    const tc=await page.getTextContent();
    const vp=page.getViewport({scale:1});
    const items=tc.items.map(i=>({text:(i.str||'').trim(),x:i.transform[4],y:i.transform[5],w:i.width||0})).filter(i=>i.text);
    pages.push({items,width:vp.width,height:vp.height,text:items.map(i=>i.text).join(' ')});
  }
  return {name:file.name,pages,text:pages.map(p=>p.text).join(' ')};
}
function rocToIso(y,m,d){return `${Number(y)+1911}-${String(m).padStart(2,'0')}-${String(d).padStart(2,'0')}`}
function groupRows(items){
  const buckets=[];
  [...items].sort((a,b)=>b.y-a.y||a.x-b.x).forEach(it=>{
    let row=buckets.find(r=>Math.abs(r.y-it.y)<3.2);
    if(!row){row={y:it.y,items:[]};buckets.push(row)}
    row.items.push(it);
  });
  return buckets.sort((a,b)=>b.y-a.y).map(r=>({y:r.y,items:r.items.sort((a,b)=>a.x-b.x),texts:r.items.sort((a,b)=>a.x-b.x).map(i=>i.text)}));
}
function parseAttendance(doc){
  const all=doc.text.replace(/\s+/g,' ');
  const code=(all.match(/\b\d{2}-EL-[A-Z0-9]+-\d{2}\b/i)||[])[0]||'';
  const teacher=(all.match(/Foreign Teacher\s*:?\s*([A-Za-z][A-Za-z .'-]{1,30}?)(?=\s+(?:每週|Date|Time|Room|收費|迄))/i)||[])[1]?.trim()||'';
  const time=all.match(/(\d{1,2}:\d{2})\s*[~～\-]\s*(\d{1,2}:\d{2})/);
  const roc=[...all.matchAll(/(\d{3})年\s*(\d{1,2})月\s*(\d{1,2})日/g)];
  const weekday=(all.match(/每週([一二三四五六日]+)\s*共\s*(\d+)\s*堂/)||[]);
  const dates=[];
  for(const pg of doc.pages){
    const rows=groupRows(pg.items);
    const numericRows=rows.map(r=>({r,nums:r.texts.filter(t=>/^\d{1,2}$/.test(t)).map(Number)})).filter(o=>o.nums.length>=12);
    if(numericRows.length>=3){
      let classRow=numericRows.find(o=>{
        const a=o.nums;
        if(a.length<10)return false;
        let inc=0; for(let i=1;i<a.length;i++) if(a[i]===a[i-1]+1) inc++;
        return inc>=Math.min(8,a.length-1);
      });
      if(classRow){
        const idx=numericRows.indexOf(classRow);
        const after=numericRows.slice(idx+1);
        const monthRow=after.find(o=>o.nums.length>=Math.max(10,classRow.nums.length-3));
        const monthIdx=after.indexOf(monthRow);
        const dayRow=after.slice(monthIdx+1).find(o=>o.nums.length>=Math.max(10,classRow.nums.length-3));
        if(monthRow&&dayRow){
          const n=Math.min(classRow.nums.length,monthRow.nums.length,dayRow.nums.length);
          const yearStart=roc[0]?Number(roc[0][1])+1911:new Date().getFullYear();
          for(let i=0;i<n;i++){
            let year=yearStart;
            const mo=monthRow.nums[i], da=dayRow.nums[i];
            if(roc[0] && mo < Number(roc[0][2])) year++;
            dates.push({classNo:classRow.nums[i],date:`${year}-${String(mo).padStart(2,'0')}-${String(da).padStart(2,'0')}`});
          }
        }
      }
    }
  }
  // de-duplicate by class number
  const dateMap=new Map(); dates.forEach(d=>dateMap.set(d.classNo,d));
  const cleanDates=[...dateMap.values()].sort((a,b)=>a.classNo-b.classNo);

  // students: use text items clustered on lines with number + Chinese + English.
  const students=[];
  for(const pg of doc.pages){
    const rows=groupRows(pg.items);
    for(const row of rows){
      const joined=row.texts.join(' ').replace(/\s+/g,' ').trim();
      const m=joined.match(/^(\d{1,2})\s+([\u3400-\u9fff]{2,5})\s+([A-Za-z][A-Za-z .'-]*)$/);
      if(m && Number(m[1])<=50 && !students.some(s=>s.no===Number(m[1]))){
        students.push({no:Number(m[1]),chinese:m[2],english:m[3].trim()});
      }
    }
  }
  return {
    kind:'attendance', code, teacher,
    start:roc[0]?rocToIso(roc[0][1],roc[0][2],roc[0][3]):'',
    end:roc[1]?rocToIso(roc[1][1],roc[1][2],roc[1][3]):'',
    startTime:time?.[1]||'', endTime:time?.[2]||'',
    weekdays:weekday[1]||'', declaredCount:Number(weekday[2]||0),
    dates:cleanDates, students
  };
}
function pageClassLabel(pg){
  const t=pg.text.replace(/\s+/g,' ');
  const m=t.match(/\b1A\s+(Unit\s+\d+|Review)\s+Class\b/i);
  return m?m[1].replace(/\s+/g,' '):'';
}
function parseSyllabus(doc){
  const lessons=[];
  for(const pg of doc.pages){
    const label=pageClassLabel(pg);
    const items=pg.items;
    // class number is in far-left class column; collect horizontal band content.
    const candidates=items.filter(i=>/^\d{1,2}$/.test(i.text) && Number(i.text)>=1 && Number(i.text)<=52 && i.x < pg.width*0.09)
      .sort((a,b)=>b.y-a.y);
    const uniq=[];
    for(const c of candidates) if(!uniq.some(u=>u.text===c.text)) uniq.push(c);
    for(let idx=0;idx<uniq.length;idx++){
      const c=uniq[idx], num=Number(c.text);
      const upper=idx===0?c.y+45:(uniq[idx-1].y+c.y)/2;
      const lower=idx===uniq.length-1?c.y-45:(c.y+uniq[idx+1].y)/2;
      const band=items.filter(i=>i.y<upper && i.y>lower && !(i===c));
      const rows=groupRows(band);
      let content=rows.map(r=>r.texts.join(' ')).join(' · ')
        .replace(/\s+/g,' ').replace(/□|/g,'').trim();
      // remove repeated class number at beginning if present
      content=content.replace(new RegExp(`^${num}\\s*`),'').trim();
      if(content.length>5) lessons.push({classNo:num,unit:label||'1A',content});
    }
  }
  const map=new Map(); lessons.forEach(l=>map.set(l.classNo,l));
  return {kind:'syllabus', lessons:[...map.values()].sort((a,b)=>a.classNo-b.classNo)};
}
function detectDoc(doc){
  const t=doc.text;
  if(/Suggested Syllabus/i.test(t)) return parseSyllabus(doc);
  if(/哥大英語/.test(t)&&/每週/.test(t)&&/Present/.test(t)) return parseAttendance(doc);
  return {kind:'unknown'};
}
async function startAIImport(inp){
  if(!inp.files.length)return;

  confirmImportBtn.disabled=true;
  importPreview.innerHTML='';
  importProgress.textContent=`正在讀取 ${inp.files.length} 個 PDF…`;
  aiStatus.textContent='AI 正在整理資料…';
  try{
    const docs=[];
    for(const f of [...inp.files]) docs.push(await readPdf(f));
    const parsed=docs.map(d=>({file:d.name,...detectDoc(d)}));
    const att=parsed.find(x=>x.kind==='attendance');
    const syl=parsed.find(x=>x.kind==='syllabus');
    if(!att||!syl){
      pendingImport=null;
      importProgress.textContent='無法完整辨識';
      importPreview.innerHTML=`<div class="card"><b>需要同時選擇：</b><br>① 點名表 PDF<br>② 1A Syllabus PDF<br><br>目前辨識：${parsed.map(x=>`${x.file} → ${x.kind}`).join('<br>')}</div>`;
      aiStatus.textContent='需要點名表 + Syllabus';
      return;
    }
    const mapped=syl.lessons.map(l=>{
      const d=att.dates.find(x=>x.classNo===l.classNo);
      return {...l,date:d?.date||'',title:`Class ${l.classNo} · ${l.unit}`};
    });
    const unmatched=att.dates.filter(d=>!syl.lessons.some(l=>l.classNo===d.classNo));

      <div class="card">
        <h3 style="margin-top:0">${att.code||'1A 班級'}</h3>
        <p><b>老師：</b>${att.teacher||'未辨識'}<br>

        ${unmatched.length?`<p style="color:#a06b00">⚠ 點名表比課綱多 ${unmatched.length} 堂；Class ${unmatched.map(x=>x.classNo).join('、')} 會保留日期，但標示「尚未對應課綱」。</p>`:''}
        <p><b>學生：</b>${att.students.map(s=>`${s.english}（${s.chinese}）`).join('、')||'未辨識'}</p>
      </div>
      <div class="card" style="margin-top:10px"><b>前 5 堂預覽</b>
      ${mapped.slice(0,5).map(l=>`<div class="record"><span><b>${l.date||'未配日期'}　${l.title}</b><small style="display:block;color:var(--muted)">${l.content.slice(0,150)}${l.content.length>150?'…':''}</small></span></div>`).join('')}</div>`;
    confirmImportBtn.disabled=false;
    aiStatus.textContent=`已辨識：${att.code} · ${att.students.length} 位學生 · ${syl.lessons.length} 堂課綱`;
  }catch(e){
    console.error(e); pendingImport=null;
    importProgress.textContent='讀取失敗';
    importPreview.innerHTML=`<div class="card">PDF 解析失敗：${String(e.message||e)}</div>`;

}
function confirmAIImport(){
  if(!pendingImport)return;
  const {att,syl,lessons,unmatched}=pendingImport;
  let c=state.classes.find(x=>x.code===att.code);
  const students=att.students.map(s=>s.english);
  const schedule=`每週${att.weekdays} ${att.startTime}–${att.endTime}`;
  const lessonData=[
    ...lessons,
    ...unmatched.map(x=>({classNo:x.classNo,date:x.date,unit:'待補',title:`Class ${x.classNo} · 尚未對應課綱`,content:'此堂在點名表中有日期，但目前上傳的 Syllabus 沒有對應內容。'}))
  ].sort((a,b)=>a.classNo-b.classNo);
  if(c){
    if(!confirm(`${att.code} 已存在。要用這次匯入資料更新班級、學生與課程嗎？`))return;
    Object.assign(c,{name:att.code.split('-').slice(-2,-1)[0]||'1A',teacher:att.teacher,schedule,students,studentDetails:att.students,lessons:lessonData,start:att.start,end:att.end});
  }else{
    c={id:Date.now(),code:att.code,name:att.code.match(/-([A-Z0-9]+)-\d+$/)?.[1]||'1A',teacher:att.teacher,schedule,students,studentDetails:att.students,lessons:lessonData,start:att.start,end:att.end};
    state.classes.push(c);
  }
  // Add lessons to calendar as course events, avoiding duplicate import for this class.
  state.records=state.records.filter(r=>!(r.importedClassCode===att.code && r.type==='event'));
  for(const l of lessonData){
    if(l.date) state.records.push({id:Date.now()+l.classNo,type:'event',date:l.date,time:att.startTime,title:`${c.name} · Class ${l.classNo}`,note:l.unit+(l.content?` · ${l.content.slice(0,120)}`:''),importedClassCode:att.code,classId:c.id,classNo:l.classNo});
  }
  closeModal('importModal'); pendingImport=null; persist(); go('classes');
  alert(`匯入完成！\n${att.code}\n${students.length} 位學生\n${lessonData.length} 堂課程已建立。`);
}
