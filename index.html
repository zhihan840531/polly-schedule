<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Polly 工作台</title>
<style>
body{margin:0;font-family:system-ui,-apple-system,"Noto Sans TC",sans-serif;background:#fffdf7;color:#3f3b32;display:grid;place-items:center;min-height:100vh}
#boot{padding:24px;text-align:center}
</style>
</head>
<body>
<div id="boot">正在載入 Polly 工作台…</div>
<script>
(async()=>{
  try{
    const url='https://raw.githubusercontent.com/zhihan840531/polly-schedule/63f26243e8f4dfe7bc5e2a1215bf97c4d8222a1d/index.html';
    const res=await fetch(url,{cache:'no-store'});
    if(!res.ok) throw new Error('HTTP '+res.status);
    let html=await res.text();
    html=html.replace('</head>',`<style>
      .card:has(#smartQueue){margin-bottom:16px !important;}
      @media(max-width:720px){.card:has(#smartQueue){margin-bottom:14px !important;}}
    </style></head>`);
    html=html.replace('</body>','<script src="./calendar-fix.js?v=4"><\/script><script src="./calendar-ui-fix.js?v=3"><\/script><script src="./sync-fix.js?v=3"><\/script><script src="./call-parent-phone.js?v=3"><\/script><script src="./class-dedupe-v1.js?v=1"><\/script><script src="./class-import.js?v=7"><\/script><script src="./import-class-match-v1.js?v=2"><\/script><script src="./syllabus-seed-261a01.js?v=1"><\/script><script src="./student-checklist.js?v=5"><\/script><script src="./student-360.js?v=2"><\/script><script src="./work-prep.js?v=5"><\/script><script src="./class-cycle-mobile-v3.js?v=2"><\/script><script src="./class-workflow-v6.js?v=1"><\/script><script src="./class-order-fix.js?v=1"><\/script><script src="./syllabus-parser-v2.js?v=2"><\/script><script src="./lesson-display-v1.js?v=1"><\/script></body>');
    document.open();
    document.write(html);
    document.close();
  }catch(err){
    document.getElementById('boot').innerHTML='<h2>工作台載入失敗</h2><p>請重新整理頁面。</p><small>'+String(err.message||err)+'</small>';
  }
})();
</script>
</body>
</html>
